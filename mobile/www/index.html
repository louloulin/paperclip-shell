<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <title>Paperclip</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #18181b; color: #e4e4e7; padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { width: min(420px, 88vw); }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { color: #a1a1aa; margin: 0 0 16px; font-size: 14px; }
      label { display: block; font-size: 13px; color: #d4d4d8; margin-bottom: 6px; }
      input {
        width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px;
        border: 1px solid #3f3f46; background: #27272a; color: #fafafa; font-size: 16px;
      }
      button {
        margin-top: 12px; width: 100%; padding: 13px 16px; border-radius: 10px; border: 0;
        background: #fafafa; color: #18181b; font-size: 15px; font-weight: 600;
      }
      button:disabled { opacity: 0.5; }
      .status { margin-top: 12px; font-size: 13px; min-height: 20px; color: #fca5a5; }
      .hint { margin-top: 20px; font-size: 12px; color: #71717a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to Paperclip</h1>
      <p>Enter the address of your Paperclip server.</p>
      <label for="server">Server address</label>
      <input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
             placeholder="https://paperclip.example.com" />
      <button id="connect" type="button">Connect</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="hint">
        Tip: bake the address into the build with
        <code>PAPERCLIP_MOBILE_SERVER_URL</code> so this screen is skipped.
      </div>
    </main>
    <script type="module">
      // Uses Capacitor Preferences when running natively; falls back to
      // localStorage in a plain browser so the page stays testable.
      const STORAGE_KEY = "paperclip.serverUrl";
      const input = document.getElementById("server");
      const button = document.getElementById("connect");
      const status = document.getElementById("status");
      const native = globalThis.Capacitor?.Plugins?.Preferences;

      const readStored = async () => {
        try {
          if (native) return (await native.get({ key: STORAGE_KEY })).value ?? "";
          return localStorage.getItem(STORAGE_KEY) ?? "";
        } catch {
          return "";
        }
      };
      const writeStored = async (value) => {
        try {
          if (native) await native.set({ key: STORAGE_KEY, value });
          else localStorage.setItem(STORAGE_KEY, value);
        } catch {
          /* storage unavailable: navigation still works for this session */
        }
      };

      const normalize = (raw) => {
        const trimmed = raw.trim();
        if (!trimmed) return null;
        const withScheme = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
        try {
          const url = new URL(withScheme);
          return url.origin;
        } catch {
          return null;
        }
      };

      const go = async (raw) => {
        const origin = normalize(raw);
        if (!origin) {
          status.textContent = "That does not look like a valid address.";
          return;
        }
        status.textContent = `Connecting to ${origin}…`;
        await writeStored(origin);
        window.location.replace(origin);
      };

      button.addEventListener("click", () => go(input.value));
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") go(input.value);
      });

      const stored = await readStored();
      if (stored) {
        input.value = stored;
        await go(stored);
      } else {
        input.focus();
      }
    </script>
  </body>
</html>
